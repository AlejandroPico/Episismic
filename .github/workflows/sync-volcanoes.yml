name: Actualizar actividad volcánica

on:
  schedule:
    - cron: "20 2 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: volcano-activity-sync
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sincronizar Smithsonian/USGS
        run: npm run sync:volcanoes
      - name: Publicar cambios
        run: |
          if git diff --quiet -- public/data/volcanoes.json.gz; then
            echo "El informe semanal no contiene cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/volcanoes.json.gz
          git commit -m "data: actualizar actividad volcánica semanal"
          git push
