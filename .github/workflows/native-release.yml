name: Publicar aplicaciones de escritorio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/**"
      - ".github/workflows/native-release.yml"

permissions:
  contents: write

jobs:
  publish-tauri:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
            target: ""
          - name: Windows x64
            platform: windows-latest
            args: ""
            target: ""
          - name: macOS Intel
            platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Objetivo Rust adicional
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: Dependencias del sistema Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Dependencias web
        run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Episismic v__VERSION__"
          releaseBody: "Versión previa 0.9 para Windows, macOS y Linux. Los binarios no están todavía firmados por una autoridad comercial."
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
