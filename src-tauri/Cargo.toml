[package]
name = "episismic"
version = "1.2.3"
description = "Observatorio geofísico mundial"
authors = ["Alejandro Pico"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/AlejandroPico/Episismic"

[lib]
name = "episismic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
